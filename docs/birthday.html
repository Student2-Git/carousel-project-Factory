<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday</title>

    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body { height: 100%; overflow-y: hidden; }
        p { text-align: center; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; 
            font-weight:bold; }    
    </style>
</head>

<body>

    <div id="birthdayContent">
        <p style="font-size:45px">Upcoming Birthdays!</p>
        <div style="height:115px;"></div>

        <p style="font-size:40px">
            <span id="labelTag"></span>
        </p>
        <div style="height:130px;"></div>

        <p style="font-size:25px;">We hope you have an amazing day</p>
    </div>

    <div style="height:220px;"></div>
    <p id="noBirthdayMessage" style="display:none; font-size:45px;">No Birthdays This Month</p>

    <py-config src="pyscript.toml"></py-config>

    <script type="py">
        import pandas as pd
        from datetime import date
        from pyscript import document

        try:
            df = pd.read_excel("testbirthdays.xlsx", engine="openpyxl")

            today = date.today()

            name = []

            for i in range(len(df)):
                bday = df['Birthday'][i]

                if pd.notna(bday) and bday.month == today.month:
                    name.append(df['Name'][i])

            if name:
                document.getElementById("labelTag").innerText = ", ".join(name)
            else:
                document.getElementById("birthdayContent").style.display = "none"
                document.getElementById("noBirthdayMessage").style.display = "block"

        except Exception as e:
            document.getElementById("birthdayContent").style.display = "none"
            document.getElementById("noBirthdayMessage").style.display = "block"
            document.getElementById("noBirthdayMessage").innerText = f"Error: {e}"
    </script>

</body>
</html>
