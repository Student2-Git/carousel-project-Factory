<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversary</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { height: 100%; overflow-y: hidden; margin: 0; }
        p { text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: bold; }
    </style>
</head>
<body>
    <div id="anniversaryContent" style="display:none;">
        <p style="font-size:45px;">Upcoming Work Anniversaries!</p>
        <div style="height:115px;"></div>

        <p style="font-size:40px;">
            <span id="labelTag"></span>
        </p>
        <div style="height:130px;"></div>

        <p style="font-size: 25px;">With us for <span id="tagLabel"></span> year(s)</p>
    </div>

    <div style="height:220px;"></div>
    <p id="noAnniversaryMessage" style="display:none; font-size:45px;">No Work Anniversaries This Month</p>

    <script>
        const DATA_FILE = "testbirthdays.xlsx";

        function showNoAnniversary(message) {
            document.getElementById("anniversaryContent").style.display = "none";
            const msgEl = document.getElementById("noAnniversaryMessage");
            msgEl.style.display = "block";
            if (message) msgEl.innerText = message;
        }

        async function loadAnniversaries() {
            try {
                const response = await fetch(DATA_FILE);
                if (!response.ok) {
                    throw new Error(`Could not load ${DATA_FILE} (status ${response.status})`);
                }
                const arrayBuffer = await response.arrayBuffer();

                // cellDates: true makes date columns come through as real JS Date objects
                const workbook = XLSX.read(arrayBuffer, { type: "array", cellDates: true });
                const firstSheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { defval: null });

                const today = new Date();
                const currentMonth = today.getMonth(); // 0-indexed, matches Date.getMonth()
                const currentYear = today.getFullYear();

                const names = [];
                const years = [];

                for (const row of rows) {
                    const anniversary = row["Anniversary"];
                    if (anniversary instanceof Date && anniversary.getMonth() === currentMonth) {
                        names.push(row["Name"]);
                        years.push(String(currentYear - anniversary.getFullYear()));
                    }
                }

                if (names.length > 0) {
                    document.getElementById("labelTag").innerText = names.join(", ");
                    document.getElementById("tagLabel").innerText = years.join(" and ");
                    document.getElementById("anniversaryContent").style.display = "block";
                } else {
                    showNoAnniversary();
                }
            } catch (err) {
                showNoAnniversary(`Error: ${err.message}`);
            }
        }

        loadAnniversaries();
    </script>
</body>
</html>
