<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Notice</title>

    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body { height: 100%; overflow-y: hidden; }
        p { text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight:bold; }
    </style>
</head>
<body>
    <div id="noticeContent" style="display:none;">
        <p style="font-size:45px; color:#a33;">⚠ Safety Notice</p>
        <div style="height:115px;"></div>

        <p style="font-size:32px;">
            <span id="labelTag"></span>
        </p>
    </div>

    <py-config src="pyscript.toml"></py-config>

    <script type="py">
        import json
        import pandas as pd
        from pyscript import document, window

        def tell_carousel(has_content):
            # Lets carousel.html know whether this slide has anything to
            # show, so it can skip this slide entirely in the rotation
            # when there's no active safety notice.
            payload = json.dumps({
                "type": "carousel-slide-status",
                "filename": "safetyNotice.html",
                "hasContent": has_content
            })
            window.parent.postMessage(payload, "*")

        try:
            df = pd.read_excel("testbirthdays.xlsx", engine="openpyxl")

            notice = None
            if "Safety Notice" in df.columns:
                for value in df["Safety Notice"]:
                    if pd.notna(value) and str(value).strip() != "":
                        notice = str(value).strip()
                        break

            if notice:
                document.getElementById("labelTag").innerText = notice
                document.getElementById("noticeContent").style.display = "block"
                tell_carousel(True)
            else:
                tell_carousel(False)

        except Exception as e:
            # If something goes wrong reading the file, fail safe by
            # hiding the slide rather than showing a broken/error slide
            # on the display.
            tell_carousel(False)
    </script>
</body>
</html>
