<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Slide</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;

        /* ============================================= */
        /* CHANGE THIS to set the background color.       */
        /* Try things like: #f8f3ea, #dbeafe, #fef3c7      */
        background: #f8f3ea;
        /* ============================================= */
    }

    h1 {
        font-size: 3rem;
        margin: 0 0 1rem 0;

        /* CHANGE THIS to set the title color */
        color: #333333;
    }

    p {
        font-size: 1.5rem;
        margin: 0;
        max-width: 800px;

        /* CHANGE THIS to set the message text color */
        color: #555555;
    }
</style>
</head>
<body>

    <!-- ============================================= -->
    <!-- CHANGE THE TEXT BELOW - don't touch the tags    -->

    <h1>Your Title Goes Here</h1>
    <p>Your message goes here. Keep it short so it's easy to read from across the room.</p>

    <!-- ============================================= -->

</body>
</html>

<!--
HOW TO USE THIS FILE:

1. Make a copy of this file (e.g. right-click > Copy, then rename
   the copy to something like "welcomeNewHire.html").

2. Open the copy in a text editor (Notepad, TextEdit, VS Code, etc.)
   - do NOT need any coding knowledge, just editing plain text.

3. Change the title and message text between the <h1> and <p> tags
   near the bottom. Don't delete the < > tags themselves.

4. Optional: change the background/text colors where marked above.

5. Save the file in the SAME FOLDER as carousel.html.

6. Open manifest.txt (a plain text file) and add your new filename
   on its own line, e.g.:

       welcomeNewHire.html

   Save manifest.txt. That's it - your slide will now show up in
   the carousel rotation.
-->
