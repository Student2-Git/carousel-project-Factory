<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team News</title>

    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body { height: 100%; overflow-y: hidden; }
        p { text-align: center; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; 
            font-weight:bold; }
    </style>
</head>
<body>
    <div id="newsContent">
        <p style="font-size:45px;">Team News</p>
        <div style="height:115px;"></div>

        <p style="font-size:40px;">
            <span id="labelTag"></span>
        </p>
    </div>

    <div style="height:220px;"></div>
    <p id="noNewsContent" style="display:none; font-size:45px;">No Current News</p>

    <py-config src="pyscript.toml"></py-config>

    <script type="py">
        import pandas as pd
        from pyscript import document

        try:
            df = pd.read_excel("testbirthdays.xlsx", engine="openpyxl")

            news = df['Team News'][0]

            if pd.notna(news):
                document.getElementById("labelTag").innerText = news
            else:
                document.getElementById("newsContent").style.display = "none"
                document.getElementById("noNewsContent").style.display = "block"

        except Exception as e:
            document.getElementById("newsContent").style.display = "none"
            document.getElementById("noNewsContent").style.display = "block"
            document.getElementById("noNewsContent").innerText = f"Error: {e}"
    </script>
</body>
</html>
