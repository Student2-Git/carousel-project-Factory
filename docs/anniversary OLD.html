<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anniversary</title>

    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body { height: 100%; overflow-y: hidden; }
        p { text-align: center; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; 
            font-weight:bold; }
    </style>
</head>
<body>
    <div id="anniversaryContent">
        <p style="font-size:45px;">Upcoming Work Anniversaries!</p>
        <div style="height:115px;"></div>

        <p style="font-size:40px;">
            <span id="labelTag"></span>
        </p>
        <div style="height:130px;"></div>

        <p style="font-size: 25px;">With us for <span id="tagLabel"></span> year(s)</p>
    </div>

    <div style="height:220px;"></div>
    <p id="noAnniversaryMessage" style="display:none; font-size:45px;">No Work Anniversaries This Month</p>

    <py-config src="pyscript.toml"></py-config>

    <script type="py">
        import pandas as pd
        from datetime import date
        from pyscript import document

        try:
            df = pd.read_excel("testbirthdays.xlsx", engine="openpyxl")

            today = date.today()

            name = []
            years= []

            for i in range(len(df)):
                anniversary = df['Anniversary'][i]

                if pd.notna(anniversary) and anniversary.month == today.month:
                    name.append(df['Name'][i])
                    years.append(str(today.year-anniversary.year))

            if name:
                document.getElementById("labelTag").innerText = ", ".join(name)
                document.getElementById("tagLabel").innerText = " and ".join(years)
            else:
                document.getElementById("anniversaryContent").style.display = "none"
                document.getElementById("noAnniversaryMessage").style.display = "block"

        except Exception as e:
            document.getElementById("anniversaryContent").style.display = "none"
            document.getElementById("noAnniversaryMessage").style.display = "block"
            document.getElementById("noAnniversaryMessage").innerText = f"Error: {e}"
    </script>
</body>
</html>
