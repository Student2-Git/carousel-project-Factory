<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Notice</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { height: 100%; overflow-y: hidden; margin: 0; }
        p { text-align: center;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-weight: bold; }
    </style>
</head>
<body>
    <div id="noticeContent" style="display:none;">
        <p style="font-size:45px; color:#a33;">⚠ Safety Notice</p>
        <div style="height:115px;"></div>

        <p style="font-size:32px;">
            <span id="labelTag"></span>
        </p>
    </div>

    <script>
        const DATA_FILE = "testbirthdays.xlsx";

        function tellCarousel(hasContent) {
            // Lets carousel.html know whether this slide has anything to
            // show, so it can skip this slide entirely in the rotation
            // when there's no active safety notice.
            const payload = JSON.stringify({
                type: "carousel-slide-status",
                filename: "safetyNotice.html",
                hasContent: hasContent
            });
            window.parent.postMessage(payload, "*");
        }

        async function loadNotice() {
            try {
                const response = await fetch(DATA_FILE);
                if (!response.ok) {
                    throw new Error(`Could not load ${DATA_FILE} (status ${response.status})`);
                }
                const arrayBuffer = await response.arrayBuffer();

                const workbook = XLSX.read(arrayBuffer, { type: "array" });
                const firstSheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[firstSheetName];
                const rows = XLSX.utils.sheet_to_json(sheet, { defval: null });

                let notice = null;
                for (const row of rows) {
                    const value = row["Safety Notice"];
                    if (value !== null && value !== undefined && String(value).trim() !== "") {
                        notice = String(value).trim();
                        break;
                    }
                }

                if (notice) {
                    document.getElementById("labelTag").innerText = notice;
                    document.getElementById("noticeContent").style.display = "block";
                    tellCarousel(true);
                } else {
                    tellCarousel(false);
                }
            } catch (err) {
                // If something goes wrong reading the file, fail safe by
                // hiding the slide rather than showing a broken/error
                // slide on the display.
                tellCarousel(false);
            }
        }

        loadNotice();
    </script>
</body>
</html>
